<script type="text/babel" data-presets="react">
// ============================================================================
// CORE SETUP — React hooks, icons, server bridge and shared helpers
// (restored section: must stay directly under the <script> line)
// ============================================================================
const { useState, useEffect, useMemo, useCallback, useRef, useDeferredValue, memo } = React;

// Lucide icons (loaded in Index.html). If an icon is missing, a small dot is shown instead of crashing.
const LUCIDE = window.LucideReact || window.lucideReact || window.lucide_react || {};
const FallbackIcon = ({ size = 16 }) => (
  <span style={{ display: 'inline-block', width: size, height: size, borderRadius: '50%', border: '1.5px solid currentColor', boxSizing: 'border-box' }} />
);
const icon = (name) => LUCIDE[name] || LUCIDE[name + 'Icon'] || FallbackIcon;
const AlertTriangle = icon('AlertTriangle');
const Archive = icon('Archive');
const ArrowUpDown = icon('ArrowUpDown');
const BookOpen = icon('BookOpen');
const CheckCircle2 = icon('CheckCircle2');
const ChevronDown = icon('ChevronDown');
const ChevronLeft = icon('ChevronLeft');
const ChevronRight = icon('ChevronRight');
const ChevronUp = icon('ChevronUp');
const Clock = icon('Clock');
const Copy = icon('Copy');
const Edit3 = icon('Edit3');
const Eye = icon('Eye');
const EyeOff = icon('EyeOff');
const ExternalLink = icon('ExternalLink');
const FileText = icon('FileText');
const FolderOpen = icon('FolderOpen');
const GraduationCap = icon('GraduationCap');
const HeartPulse = icon('HeartPulse');
const Image = icon('Image');
const Info = icon('Info');
const LayoutGrid = icon('LayoutGrid');
const Loader2 = icon('Loader2');
const Lock = icon('Lock');
const Palette = icon('Palette');
const Plus = icon('Plus');
const RefreshCw = icon('RefreshCw');
const RotateCcw = icon('RotateCcw');
const Search = icon('Search');
const Settings = icon('Settings');

const ShieldAlert = icon('ShieldAlert');
const Sliders = icon('Sliders');
const Sparkles = icon('Sparkles');
const Trash2 = icon('Trash2');
const UploadCloud = icon('UploadCloud');
const UserPlus = icon('UserPlus');
const X = icon('X');
const ZoomIn = icon('ZoomIn');

// ---------------------------------------------------------------------------
// Sheet layout (0-based column indexes)
// ---------------------------------------------------------------------------
const PHOTO_META_COL = 15;          // Column P = photo references (JSON)
const CASE_FOLDER_COL_IDX = 16;     // Column Q = Drive folder link
const PHOTO_DATA_CELL_COUNT = 30;   // max photos per case
const PHOTO_MAX_SIDE = 2000;        // photos are resized to this before upload

// ---------------------------------------------------------------------------
// Server bridge: runServer('fnName', ...args) → Promise
// ---------------------------------------------------------------------------
const runServer = (fnName, ...args) => new Promise((resolve, reject) => {
  if (!window.google || !google.script || !google.script.run) {
    reject(new Error('Not running inside Apps Script.'));
    return;
  }
  google.script.run
    .withSuccessHandler(resolve)
    .withFailureHandler((err) => reject(err instanceof Error ? err : new Error(String((err && err.message) || err))))
    [fnName](...args);
});

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
const isColChecked = (v) => {
  if (v === true || v === 1) return true;
  const s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === 'y' || s === '1' || s === '✓' || s === '✔' || s === 'x';
};

const todayIso = () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};

const displayDate = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number' && isFinite(v)) {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : s;
};

// Keeps every cell sheet-safe (no null/undefined, no cell over 49,000 characters)
const sanitizeRowForSheet = (row) => (Array.isArray(row) ? row : []).map(v => {
  if (v === null || v === undefined) return '';
  if (typeof v === 'string' && v.length > 49000) return v.slice(0, 49000);
  return v;
});

const safeGetStorage = (key) => {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
};
const safeSetStorage = (key, value) => {
  try { window.localStorage.setItem(key, value); } catch (e) { /* storage blocked */ }
};
const safeRemoveStorage = (key) => {
  try { window.localStorage.removeItem(key); } catch (e) { /* storage blocked */ }
};

// Reads the saved settings (virtual __TRACKER_CONFIG__ row sent by Code.gs)
const extractSheetConfig = (data) => {
  if (!Array.isArray(data)) return null;
  const env = data.find(e => Array.isArray(e?.row) && String(e.row[0]).trim() === '__TRACKER_CONFIG__');
  if (!env) return null;
  try {
    const parsed = JSON.parse(String(env.row[1] || '{}'));
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch (e) {
    return null;
  }
};

// ---------------------------------------------------------------------------
// Status matching + colors
// ---------------------------------------------------------------------------
const STATUS_GREEN = 'Green – Cleared for Face-to-Face';
const STATUS_YELLOW = 'Yellow – Under Monitoring';
const STATUS_BLUE = 'Blue – Alternative Learning Modality';
const STATUS_RED = 'Red – Restricted or Pending Documents';
const STATUS_PURPLE = 'Purple – WITHDRAWN / Case Closed';

const statusCache = new Map();
const fastMatchCanonicalStatus = (value) => {
  const raw = String(value === null || value === undefined ? '' : value).trim();
  if (!raw) return '';
  if (statusCache.has(raw)) return statusCache.get(raw);
  const s = raw.toLowerCase();
  let out = '';
  if (s.startsWith('green') || s.includes('cleared')) out = STATUS_GREEN;
  else if (s.startsWith('yellow') || s.includes('monitor')) out = STATUS_YELLOW;
  else if (s.startsWith('blue') || s.includes('alternative') || /\balm\b/.test(s) || s.includes('modular') || s.includes('online')) out = STATUS_BLUE;
  else if (s.startsWith('red') || s.includes('restrict') || s.includes('pending')) out = STATUS_RED;
  else if (s.startsWith('purple') || s.includes('withdraw') || s.includes('closed')) out = STATUS_PURPLE;
  statusCache.set(raw, out);
  return out;
};

const STATUS_COLORS = {
  [STATUS_GREEN]: { bg: '#ECFDF5', text: '#065F46', border: '#A7F3D0', dot: '#10B981', label: 'Cleared F2F' },
  [STATUS_YELLOW]: { bg: '#FFFBEB', text: '#92400E', border: '#FDE68A', dot: '#F59E0B', label: 'Under Monitoring' },
  [STATUS_BLUE]: { bg: '#EFF6FF', text: '#1E40AF', border: '#BFDBFE', dot: '#3B82F6', label: 'Alternative Learning' },
  [STATUS_RED]: { bg: '#FEF2F2', text: '#991B1B', border: '#FECACA', dot: '#EF4444', label: 'Restricted / Pending' },
  [STATUS_PURPLE]: { bg: '#FAF5FF', text: '#6B21A8', border: '#E9D5FF', dot: '#9333EA', label: 'Withdrawn / Closed' }
};
const fastGetStatusColors = (value) =>
  STATUS_COLORS[fastMatchCanonicalStatus(value)] || { bg: '#F7F3F1', text: '#5C4742', border: '#EBDCD4', dot: '#A8928C', label: 'No status' };

// ---------------------------------------------------------------------------
// Photos (stored in Google Drive; Column P keeps only references)
// ---------------------------------------------------------------------------
const photoPreviewCache = new Map();   // driveId → data URL (so new uploads preview instantly)

const parseStudentPhotos = (row) => {
  const cell = Array.isArray(row) ? row[PHOTO_META_COL] : '';
  if (!cell || typeof cell !== 'string') return [];
  try {
    const list = JSON.parse(cell);
    return Array.isArray(list) ? list.filter(p => p && typeof p === 'object') : [];
  } catch (e) {
    return [];
  }
};

const hasActualImageData = (photo) => Boolean(photo && (photo.driveId || photo.dataUrl));

// Writes the photo list into Column P. Photos without a Drive file are dropped.
const packPhotosIntoRow = (row, photos) => {
  const out = Array.isArray(row) ? [...row] : [];
  while (out.length <= PHOTO_META_COL) out.push('');
  const list = Array.isArray(photos) ? photos : [];
  const kept = list
    .filter(p => p && p.driveId)
    .map(p => ({
      id: p.id || p.driveId,
      driveId: p.driveId,
      name: p.name || 'photo.jpg',
      size: Number(p.size) || 0,
      type: p.type || 'image/jpeg',
      date: p.date || todayIso()
    }));
  out[PHOTO_META_COL] = kept.length ? JSON.stringify(kept) : '';
  return { row: out, dropped: list.length - kept.length };
};

const cellsUsedBy = (photos) => (Array.isArray(photos) ? photos.length : 0);

const formatFileSize = (bytes) => {
  const n = Number(bytes) || 0;
  if (!n) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
};

const getCaseFolderUrl = (row) => {
  const v = Array.isArray(row) ? String(row[CASE_FOLDER_COL_IDX] || '').trim() : '';
  return /^https?:\/\//.test(v) ? v : null;
};

const buildUploadMessage = (added, skipped, failed) => {
  const parts = [];
  if (added) parts.push(`${added} photo${added === 1 ? '' : 's'} uploaded to Drive`);
  if (skipped) parts.push(`${skipped} skipped (limit is ${PHOTO_DATA_CELL_COUNT} photos per case, images only)`);
  if (failed) parts.push(`${failed} failed to upload`);
  return parts.length ? parts.join(' • ') + '.' : 'No photos were added.';
};

// Reads a file, resizes it (max 2000px, JPEG) and returns a data URL
const fileToResizedDataUrl = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(new Error('Could not read the file.'));
  reader.onload = () => {
    const img = new window.Image();
    img.onerror = () => reject(new Error('Not a readable image.'));
    img.onload = () => {
      const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

// Uploads files to the case's Drive folder. Returns { added: [photo], skipped, failed }
const preparePhotosFromFiles = async (files, existingPhotos, caseIndex) => {
  const list = Array.from(files || []);
  const room = Math.max(0, PHOTO_DATA_CELL_COUNT - (existingPhotos ? existingPhotos.length : 0));
  const added = [];
  let skipped = 0;
  let failed = 0;
  for (const file of list) {
    if (!file || !/^image\//.test(file.type || '') || added.length >= room) {
      skipped++;
      continue;
    }
    try {
      const dataUrl = await fileToResizedDataUrl(file);
      const baseName = String(file.name || 'photo').replace(/\.[^.]+$/, '');
      const photo = await runServer('uploadPhoto', {
        dataUrl,
        name: `${baseName}.jpg`,
        size: Math.round((dataUrl.length - 23) * 0.75),
        caseIndex: typeof caseIndex === 'number' ? caseIndex : null
      });
      photoPreviewCache.set(photo.driveId, dataUrl);
      added.push(photo);
    } catch (err) {
      console.warn('Photo upload failed:', err);
      failed++;
    }
  }
  return { added, skipped, failed };
};

// Shows a Drive photo (thumbnail or full size), loading it through Code.gs
function RealPhotoImage({ photo, isThumbnail = false, style = {} }) {
  const driveId = photo && photo.driveId;
  const cacheKey = driveId ? `${driveId}:${isThumbnail ? 't' : 'f'}` : '';
  const initial = (photo && photo.dataUrl) || (driveId && (photoPreviewCache.get(cacheKey) || photoPreviewCache.get(driveId))) || '';
  const [src, setSrc] = useState(initial);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    let alive = true;
    setFailed(false);
    const cached = (photo && photo.dataUrl) || (driveId && (photoPreviewCache.get(cacheKey) || photoPreviewCache.get(driveId)));
    if (cached) {
      setSrc(cached);
      return () => { alive = false; };
    }
    setSrc('');
    if (!driveId) return () => { alive = false; };
    runServer('getPhotoData', driveId, Boolean(isThumbnail))
      .then(url => {
        photoPreviewCache.set(cacheKey, url);
        if (alive) setSrc(url);
      })
      .catch(() => { if (alive) setFailed(true); });
    return () => { alive = false; };
  }, [driveId, cacheKey, photo && photo.dataUrl, isThumbnail]);

  const box = {
    width: '100%',
    height: '100%',
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    color: '#C44263',
    backgroundColor: '#FFF5F2',
    fontSize: '10px',
    fontWeight: 700,
    minHeight: isThumbnail ? 0 : '160px',
    minWidth: isThumbnail ? 0 : '160px'
  };

  if (!photo || (!driveId && !photo.dataUrl) || failed) {
    return <div style={box}><Image size={18} /></div>;
  }
  if (!src) {
    return <div style={box}><Loader2 size={16} style={{ animation: 'spin 1s linear infinite' }} /></div>;
  }
  return (
    <img
      src={src}
      alt={photo.name || 'Case photo'}
      draggable={false}
      style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', ...style }}
    />
  );
}

// "Open Drive folder" link
function CaseFolderLink({ url, label = 'Open Drive folder', dark = false, compact = false }) {

    <a
      href={url}

      style={{
        display: 'inline-flex',
        alignItems: 'center',
        gap: '4px',
        padding: compact ? '2px 5px' : '5px 10px',
        borderRadius: compact ? '4px' : '8px',
        fontSize: compact ? '9px' : '11px',
        fontWeight: 700,
        textDecoration: 'none',
        whiteSpace: 'nowrap',
        backgroundColor: dark ? 'rgba(255,255,255,0.15)' : '#EFF6FF',
        color: dark ? '#FFFFFF' : '#1D4ED8',
        border: dark ? '1px solid rgba(255,255,255,0.3)' : '1px solid #BFDBFE'
      }}
    >
      <FolderOpen size={compact ? 10 : 13} />

}

// Date field used in the Add / Edit form
function DatePickerPopover({ label, value, onChange, placeholder = 'YYYY-MM-DD' }) {
  return (
    <div>
      {label && (
        <label style={{ display: 'block', fontSize: '12px', fontWeight: 700, color: '#523B36', marginBottom: '6px' }}>
          {label}
        </label>
      )}
      <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
        <input
          type="date"
          value={displayDate(value)}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
          style={{
            flex: 1,
            width: '100%',
            padding: '8px 12px',

        {value && (
          <button
            type="button"
            onClick={() => onChange('')}
            title="Clear date"
            style={{
              background: '#FFF0EA',

              borderRadius: '6px',
              padding: '6px',
              cursor: 'pointer',

}

// ============================================================================
// EDITABLE LISTS — Categories (multi-select), Learning Modalities, Statuses
// Saved in Settings and synced to the sheet by Code.gs:
//   Categories → column E (comma list)   Modalities → column G dropdown
//   Statuses   → column L dropdown + cell colors
// ============================================================================
const normKey = (s) => String(s === null || s === undefined ? '' : s)
  .toLowerCase().replace(/[–—]/g, '-').replace(/\s*-\s*/g, ' - ').replace(/\s+/g, ' ').trim();
const cleanText = (s, max = 80) => String(s === null || s === undefined ? '' : s).replace(/[\r\n\t]+/g, ' ').trim().slice(0, max);
const optionCode = (v) => String(v || '').split(/\s*[–—-]\s*/)[0].trim().toUpperCase();
const isHexColor = (c) => /^#[0-9a-f]{6}$/i.test(String(c || ''));

// ----- colors -----
const hexToRgb = (hex) => {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  if (isNaN(n)) return [168, 146, 140];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const mixHex = (hex, target, amt) => {
  const [r, g, b] = hexToRgb(hex);
  const m = (c) => Math.round(c + (target - c) * amt);
  return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join('');
};
const tintHex = (hex, amt) => mixHex(hex, 255, amt);
const shadeHex = (hex, amt) => mixHex(hex, 0, amt);

// ----- statuses -----
const DEFAULT_STATUSES = [
  { id: 'st-green', label: 'Green – Cleared for Face-to-Face', color: '#10B981', showCard: true, cardTitle: '🟢 Cleared F2F', subtitle: 'Cleared for regular attendance', icon: 'CheckCircle2' },
  { id: 'st-yellow', label: 'Yellow – Under Monitoring', color: '#F59E0B', showCard: true, cardTitle: '🟡 Under Monitoring', subtitle: 'Ongoing guidance & clinic review', icon: 'Clock' },
  { id: 'st-blue', label: 'Blue – Alternative Learning Modality', color: '#3B82F6', showCard: true, cardTitle: '🔵 Under ALM', subtitle: 'Home study & alternative modules', icon: 'BookOpen' },
  { id: 'st-red', label: 'Red – Restricted or Pending Documents', color: '#EF4444', showCard: true, cardTitle: '🔴 Restricted / Pending', subtitle: 'Campus restriction or clearance pending', icon: 'ShieldAlert' },
  { id: 'st-purple', label: 'Purple – WITHDRAWN / Case Closed', color: '#9333EA', showCard: true, cardTitle: '🟣 Withdrawn / Closed', subtitle: 'Formal withdrawal or case concluded', icon: 'Archive' }
];
const LEGACY_STATUS_IDS = {
  [STATUS_GREEN]: 'st-green', [STATUS_YELLOW]: 'st-yellow', [STATUS_BLUE]: 'st-blue', [STATUS_RED]: 'st-red', [STATUS_PURPLE]: 'st-purple'
};
const LEGACY_KPI_KEYS = {
  'st-green': 'clearedF2f', 'st-yellow': 'underMonitoring', 'st-blue': 'almCases', 'st-red': 'restrictedPending', 'st-purple': 'withdrawnClosed'
};
const STATUS_ICONS = { CheckCircle2, Clock, BookOpen, ShieldAlert, Archive };

// Cleans a saved status list. With no saved list, uses the 5 defaults (keeping old KPI card titles).
const normalizeStatuses = (list, kpiConfig) => {
  if (Array.isArray(list) && list.length) {
    const seen = new Set();
    const out = list
      .filter(s => s && cleanText(s.label, 100))
      .map((s, i) => ({
        id: String(s.id || `st-${i}`),
        label: cleanText(s.label, 100),
        color: isHexColor(s.color) ? s.color : '#8A736E',
        showCard: s.showCard !== false,
        cardTitle: cleanText(s.cardTitle, 60),
        subtitle: cleanText(s.subtitle, 100),
        icon: s.icon || ''
      }))
      .filter(s => {
        const k = normKey(s.label);
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    if (out.length) return out;
  }
  return DEFAULT_STATUSES.map(s => {
    const k = kpiConfig && kpiConfig[LEGACY_KPI_KEYS[s.id]];
    return k
      ? { ...s, showCard: k.visible !== false, cardTitle: k.title || s.cardTitle, subtitle: k.subtitle || s.subtitle }
      : { ...s };
  });
};

// value in column L → status object (exact name first, then old wording like "F2F under monitoring")
const makeStatusResolver = (list) => {
  const byName = new Map();
  const byId = new Map();
  (list || []).forEach(s => { byName.set(normKey(s.label), s); byId.set(s.id, s); });
  const cache = new Map();
  return (value) => {
    const raw = String(value === null || value === undefined ? '' : value).trim();
    if (!raw) return null;
    if (cache.has(raw)) return cache.get(raw);
    let s = byName.get(normKey(raw)) || null;
    if (!s) {
      const canon = fastMatchCanonicalStatus(raw);
      if (canon) s = byId.get(LEGACY_STATUS_IDS[canon]) || null;
    }
    cache.set(raw, s);
    return s;
  };
};

const shortStatusLabel = (label) =>
  String(label || '').replace(/^(green|yellow|blue|red|purple|orange|gray|grey|pink|black|white)\s*[–—-]\s*/i, '');

const statusColorsFor = (s) => (s
  ? { bg: tintHex(s.color, 0.9), border: tintHex(s.color, 0.6), text: shadeHex(s.color, 0.45), dot: s.color, label: shortStatusLabel(s.label) }
  : { bg: '#F7F3F1', text: '#5C4742', border: '#EBDCD4', dot: '#A8928C', label: 'Unknown status' });

// ----- categories (a case can have several: "MH – Mental Health, FC – Family Crisis") -----
const splitCategoryCell = (v) => String(v === null || v === undefined ? '' : v)
  .split(/\s*[,;\n]\s*/).map(x => x.trim()).filter(Boolean);
const matchCategory = (part, cats) =>
  (cats || []).find(c => normKey(c.full) === normKey(part)) ||
  (cats || []).find(c => String(c.code).toUpperCase() === optionCode(part)) || null;
const parseCategoryCell = (v, cats) => {
  const out = [];
  splitCategoryCell(v).forEach(p => {
    const c = matchCategory(p, cats);
    const val = c ? c.full : p;
    if (!out.includes(val)) out.push(val);
  });
  return out;
};
const categoryCodesOf = (v, cats) => parseCategoryCell(v, cats).map(optionCode);

// ----- list editing rules -----
const withIds = (list, prefix) => (Array.isArray(list) ? list : [])
  .filter(o => o && typeof o === 'object')
  .map((o, i) => ({ ...o, id: o.id || `${prefix}-${i}-${optionCode(o.full || o.code) || 'x'}` }));

const OPTION_KINDS = {
  category: { noun: 'category', plural: 'categories', hasCode: true, codeMax: 4, hasColor: true, where: 'column E' },
  modality: { noun: 'modality', plural: 'modalities', hasCode: true, codeMax: 5, hasColor: false, where: 'the column G dropdown' },
  status: { noun: 'status', plural: 'statuses', hasCode: false, hasColor: true, where: 'the column L dropdown and cell colors' }
};

const optionValue = (kind, o) => (kind === 'status' ? cleanText(o.label, 100) : (o.full || `${o.code} – ${o.label}`));

const buildOption = (kind, o) => {
  if (kind === 'status') {
    return { ...o, label: String(o.label || '').replace(/[\r\n\t]+/g, ' ').slice(0, 100) };
  }
  // no commas/semicolons: they separate multiple categories in one cell
  const code = String(o.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, OPTION_KINDS[kind].codeMax);
  const label = String(o.label || '').replace(/[,;\r\n\t]+/g, ' ').slice(0, 80);
  const full = label.trim() ? `${code} – ${label.trim()}` : code;
  const out = { ...o, code, label, full };
  if (kind === 'category') {
    out.color = isHexColor(o.color) ? o.color : '#4B6B94';
    out.bg = tintHex(out.color, 0.92);
  }
  return out;
};

// Trims + checks a list before saving. Returns { list, error }
const finalizeOptions = (kind, list) => {
  const cfg = OPTION_KINDS[kind];
  const cleaned = (list || []).map(o => {
    const b = buildOption(kind, { ...o, label: String(o.label || '').trim() });
    return kind === 'status'
      ? { ...b, label: cleanText(b.label, 100), color: isHexColor(b.color) ? b.color : '#64748B' }
      : b;
  });
  if (!cleaned.length) return { list: cleaned, error: `Keep at least one ${cfg.noun}.` };
  if (cfg.hasCode) {
    if (cleaned.some(o => !o.code)) return { list: cleaned, error: `Every ${cfg.noun} needs a code.` };
    if (cleaned.some(o => !String(o.label).trim())) return { list: cleaned, error: `Every ${cfg.noun} needs a name.` };
    const codes = cleaned.map(o => o.code);
    const dup = codes.find((c, i) => codes.indexOf(c) !== i);
    if (dup) return { list: cleaned, error: `The code "${dup}" is used twice. Codes must be unique.` };
  } else {
    if (cleaned.some(o => !o.label)) return { list: cleaned, error: `Every ${cfg.noun} needs a name.` };
    const names = cleaned.map(o => normKey(o.label));
    const dupIdx = names.findIndex((n, i) => names.indexOf(n) !== i);
    if (dupIdx !== -1) return { list: cleaned, error: `"${cleaned[dupIdx].label}" is listed twice.` };
  }
  return { list: cleaned, error: '' };
};

const uniqueCode = (list, base) => {
  const used = new Set((list || []).map(o => String(o.code || '').toUpperCase()));
  if (!used.has(base)) return base;
  let i = 2;
  while (used.has(`${base.slice(0, 3)}${i}`)) i++;
  return `${base.slice(0, 3)}${i}`;
};

const newOption = (kind, list) => {
  const id = `${kind}-${Date.now()}`;
  if (kind === 'category') return buildOption(kind, { id, code: uniqueCode(list, 'NEW'), label: 'New Category', color: '#4B6B94' });
  if (kind === 'modality') return buildOption(kind, { id, code: uniqueCode(list, 'NEW'), label: 'New Modality' });
  let n = 1;
  while ((list || []).some(s => normKey(s.label) === normKey(`New Status ${n}`))) n++;
  return { id, label: `New Status ${n}`, color: '#64748B', showCard: true, cardTitle: '', subtitle: '', icon: '' };
};

// Old value → new value for items that were renamed (matched by id)
const renameMapFor = (kind, oldList, newList) => {
  const map = {};
  (oldList || []).forEach(o => {
    const n = (newList || []).find(x => x.id === o.id);
    if (n && optionValue(kind, n) !== optionValue(kind, o)) map[optionValue(kind, o)] = optionValue(kind, n);
  });
  return map;
};

// Warning box for deleted items that are still used by cases
function RemovedOptionsNotice({ kind, oldList, newList, usage }) {
  const cfg = OPTION_KINDS[kind];
  const removed = (oldList || []).filter(o => !(newList || []).some(n => n.id === o.id));
  if (!removed.length) return null;
  const inUse = removed.filter(o => usage[o.id]);

    <div style={{

// "Manage" panel shown inside the Add / Edit case form
function InlineOptionManager({ kind, list, usage, onSave, onClose }) {
  const cfg = OPTION_KINDS[kind];
  const [draft, setDraft] = useState(() => list.map(o => ({ ...o })));
  const [error, setError] = useState('');
  const save = () => {
    const { list: cleaned, error: err } = finalizeOptions(kind, draft);
    if (err) { setError(err); return; }
    onSave(cleaned);
    onClose();
  };
  return (
    <div style={{
      gridColumn: '1 / -1', backgroundColor: '#FFF9F6', border: '1.5px solid #F7D8CB', borderRadius: '12px', padding: '14px',

          Save & update sheet
        </button>
      </div>

  );
}

const fmtDate = (v) => {
  const s = displayDate(v);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s || '—';
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

// "3 days overdue" / "Due today" / "in 5 days"
const reviewInfo = (v, closed) => {
  const s = displayDate(v);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || closed) return null;
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date();
  const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const diff = Math.round((new Date(y, m - 1, d) - today) / 86400000);
  if (diff < 0) return { text: `${-diff} day${diff === -1 ? '' : 's'} overdue`, color: '#DC2626', bg: '#FEF2F2' };
  if (diff === 0) return { text: 'Due today', color: '#C2410C', bg: '#FFF7ED' };
  if (diff <= 7) return { text: `in ${diff} day${diff === 1 ? '' : 's'}`, color: '#B45309', bg: '#FFFBEB' };
  return { text: `in ${diff} days`, color: '#6B7280', bg: '#F3F4F6' };
};

// Everything a view needs about one case
const describeCase = (item, ctx) => {
  const r = item.row || [];
  const statusObj = ctx.resolveStatus(r[11]);
  const closed = Boolean(statusObj && (statusObj.id === 'st-purple' || /withdraw|closed/i.test(statusObj.label)));
  const checklist = (ctx.checklist || []).map(c => ({ ...c, checked: isColChecked(r[c.col]) }));
  return {
    r,
    no: r[0],
    name: String(r[1] || ''),
    section: String(r[2] || ''),
    adviser: String(r[3] || ''),
    cats: parseCategoryCell(r[4], ctx.categories),
    modality: String(r[6] || ''),
    statusObj,
    statusValue: statusObj ? statusObj.label : String(r[11] || ''),
    colors: statusColorsFor(statusObj),
    remarks: String(r[14] || ''),
    photos: parseStudentPhotos(r),
    folderUrl: getCaseFolderUrl(r),
    checklist,
    done: checklist.filter(c => c.checked).length,
    review: reviewInfo(r[13], closed)
  };
};

        const color = cat ? cat.color : '#A8928C';

        return (
          <span key={full} title={full} style={{

// ============================================================================
// COMPLIANCE CHECKLIST — add / rename / delete items (synced to the spreadsheet)
// Built-in items = sheet columns I–K (rename or hide; the column stays)
// New items = their own checkbox column from Column R onward (deleting removes the column)
// ============================================================================
const CHECKLIST_EXTRA_START_COL = 17;   // 0-based index of Column R
const CHECKLIST_EXTRA_MAX_COL = 60;     // same as CHECKLIST_MAX_COL in Code.gs
const CHECKLIST_MAX_EXTRAS = 12;
const CHECKLIST_FORM_KEYS = { 8: 'adviserNotified', 9: 'healthDecSubmitted', 10: 'medClearanceOnFile' };
const DEFAULT_CHECKLIST = [
  { id: 'builtin-8', col: 8, label: 'Adviser Notified', builtin: true, hidden: false },
  { id: 'builtin-9', col: 9, label: 'Health Declaration Submitted', builtin: true, hidden: false },
  { id: 'builtin-10', col: 10, label: 'Medical Clearance on File', builtin: true, hidden: false }
];

const cleanChecklistLabel = (s) => String(s || '').trim().replace(/^[=+\-@]+/, '').trim().slice(0, 80);

// Always returns the 3 built-in items (renamed / hidden flags kept) + valid extra items
const normalizeChecklist = (list) => {
  const src = Array.isArray(list) ? list : [];
  const base = DEFAULT_CHECKLIST.map(d => {
    const found = src.find(x => x && Number(x.col) === d.col);
    const label = cleanChecklistLabel(found && found.label) || d.label;
    return { ...d, label, hidden: Boolean(found && found.hidden) };
  });
  const seen = new Set();
  const extras = src.filter(x => {
    if (!x || !x.id) return false;
    const col = Number(x.col);
    if (!(col >= CHECKLIST_EXTRA_START_COL && col <= CHECKLIST_EXTRA_MAX_COL)) return false;
    if (!cleanChecklistLabel(x.label) || seen.has(col)) return false;
    seen.add(col);
    return true;
  }).map(x => ({ id: String(x.id), col: Number(x.col), label: cleanChecklistLabel(x.label), builtin: false, hidden: false }));
  return [...base, ...extras];
};

const visibleChecklist = (list) => (list || []).filter(x => !x.hidden);

// A case is "fully verified" when every visible checklist item is ticked
const isRowFullyVerified = (row, list) => {
  const items = visibleChecklist(list);
  if (items.length === 0) return false;
  return items.every(x => isColChecked((row || [])[x.col]));
};

// Reads the checklist straight from the __TRACKER_CONFIG__ envelope
const readChecklistFromData = (data) => {
  if (!Array.isArray(data)) return null;
  const env = data.find(e => Array.isArray(e?.row) && String(e.row[0]).trim() === '__TRACKER_CONFIG__');
  if (!env) return null;
  try {
    const parsed = JSON.parse(String(env.row[1] || '{}'));
    return Array.isArray(parsed.checklistList) ? parsed.checklistList : null;
  } catch (err) {
    return null;
  }
};

// Any date cell (ISO text, Excel serial, Date text) → YYYY-MM-DD for the form
const ckToIso = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number' && isFinite(v)) {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};

// Puts the ticks of the extra checklist items into their sheet columns
const applyExtraChecks = (row, list, checks, existingRow) => {
  const out = Array.isArray(row) ? [...row] : [];
  (list || []).forEach(item => {
    if (item.col < CHECKLIST_EXTRA_START_COL) return;
    while (out.length <= item.col) out.push('');
    const chosen = checks && checks[item.id] !== undefined
      ? checks[item.id]
      : isColChecked(existingRow ? existingRow[item.col] : false);
    out[item.col] = Boolean(chosen);
  });
  return out;
};

const isChecklistItemChecked = (item, formData, editRow) => {
  const formKey = CHECKLIST_FORM_KEYS[item.col];
  if (formKey) return Boolean(formData[formKey]);
  if (formData.extraChecks && formData.extraChecks[item.id] !== undefined) return Boolean(formData.extraChecks[item.id]);
  return isColChecked(editRow ? editRow[item.col] : false);
};

// The checklist box inside the Add / Edit case form (pencil = add, rename, delete items)
function ChecklistSection({ checklistList, formData, setFormData, editRow, onSaveChecklist }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState([]);
  const [newLabel, setNewLabel] = useState('');
  const [error, setError] = useState('');

  const startEdit = () => {
    setDraft(checklistList.map(x => ({ ...x })));
    setNewLabel('');
    setError('');
    setEditing(true);
  };

  const nextFreeCol = (list) => {
    const used = new Set(list.map(x => x.col));
    let c = CHECKLIST_EXTRA_START_COL;
    while (used.has(c) && c <= CHECKLIST_EXTRA_MAX_COL) c++;
    return c <= CHECKLIST_EXTRA_MAX_COL ? c : -1;
  };

  const addItem = () => {
    const label = cleanChecklistLabel(newLabel);
    if (!label) return;
    if (draft.some(x => x.label.trim().toLowerCase() === label.toLowerCase())) {
      setError('That checklist item already exists.');
      return;
    }
    if (draft.filter(x => !x.builtin).length >= CHECKLIST_MAX_EXTRAS) {
      setError(`You can add up to ${CHECKLIST_MAX_EXTRAS} new items.`);
      return;
    }
    const col = nextFreeCol(draft);
    if (col === -1) {
      setError('No free spreadsheet column left for a new item.');
      return;
    }
    setDraft(prev => [...prev, { id: `chk-${Date.now()}`, col, label, builtin: false, hidden: false }]);
    setNewLabel('');
    setError('');
  };

  const saveEdit = () => {
    const cleaned = draft
      .map(x => {
        const fallback = DEFAULT_CHECKLIST.find(d => d.col === x.col);
        const label = cleanChecklistLabel(x.label);
        return { ...x, label: label || (x.builtin && fallback ? fallback.label : '') };
      })
      .filter(x => x.label);
    const names = cleaned.map(x => x.label.toLowerCase());
    if (new Set(names).size !== names.length) {
      setError('Two items have the same name. Please rename one.');
      return;
    }
    onSaveChecklist(normalizeChecklist(cleaned));
    setEditing(false);
    setError('');
  };

  // Extra items that will be deleted on save (removed, or name left blank)
  const removed = checklistList.filter(x => !x.builtin && !draft.some(d => d.id === x.id && cleanChecklistLabel(d.label)));
  const visible = visibleChecklist(checklistList);
  const hiddenCount = checklistList.length - visible.length;

  const inputStyle = {
    flex: 1,
    padding: '7px 10px',
    fontSize: '13px',
    borderRadius: '8px',
    border: '1px solid #EBDCD4',
    backgroundColor: '#FFFFFF',
    boxSizing: 'border-box',
    outline: 'none'
  };
  const iconBtn = {
    borderRadius: '6px',
    padding: '6px',
    cursor: 'pointer',
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center'
  };

  return (
    <div style={{
      backgroundColor: '#FFF9F6',
      border: '1px solid #F7E4DC',
      borderRadius: '10px',
      padding: '14px',
      marginBottom: '16px'
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
        <div style={{ fontSize: '12px', fontWeight: 700, color: '#C44263' }}>
          Compliance & Verification Checklist
        </div>
        {!editing && (
          <button
            type="button"
            data-edit="1"
            onClick={startEdit}
            style={{
              backgroundColor: '#FFF2EB',
              border: '1px solid #FCD4C2',
              color: '#D95A3B',
              borderRadius: '6px',
              padding: '4px 8px',
              cursor: 'pointer',
              display: 'inline-flex',
              alignItems: 'center',
              gap: '5px',
              fontSize: '11px',
              fontWeight: 700
            }}
            title="Add, rename or delete checklist items"
          >
            <Edit3 size={13} />
            Manage items
          </button>
        )}
      </div>

      {!editing ? (
        <>
          {visible.length === 0 ? (
            <div style={{ fontSize: '12px', color: '#8F7872' }}>
              No checklist items. Click "Manage items" to add one.
            </div>
          ) : (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '14px 20px' }}>
              {visible.map(item => {
                const formKey = CHECKLIST_FORM_KEYS[item.col];
                const checked = isChecklistItemChecked(item, formData, editRow);
                return (
                  <label key={item.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px', cursor: 'pointer' }}>
                    <input
                      type="checkbox"
                      checked={checked}
                      onChange={(e) => {
                        const val = e.target.checked;
                        if (formKey) {
                          setFormData(prev => ({ ...prev, [formKey]: val }));
                        } else {
                          setFormData(prev => ({ ...prev, extraChecks: { ...(prev.extraChecks || {}), [item.id]: val } }));
                        }
                      }}
                      style={{ accentColor: '#E06D85', width: '16px', height: '16px' }}
                    />
                    <span>{item.label}</span>
                  </label>
                );
              })}
            </div>
          )}
          {hiddenCount > 0 && (
            <div style={{ fontSize: '10px', color: '#A8928C', marginTop: '8px' }}>
              {hiddenCount} hidden item{hiddenCount === 1 ? '' : 's'} (kept in the sheet, not counted in "Full Docs Verified").
            </div>
          )}
        </>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
          {draft.map(item => (
            <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <input
                type="text"
                value={item.label}
                maxLength={80}
                onChange={(e) => {
                  const v = e.target.value;
                  setDraft(prev => prev.map(x => x.id === item.id ? { ...x, label: v } : x));
                }}
                onKeyDown={(e) => { if (e.key === 'Enter') e.preventDefault(); }}
                style={{ ...inputStyle, opacity: item.hidden ? 0.5 : 1, textDecoration: item.hidden ? 'line-through' : 'none' }}
              />
              <span style={{ fontSize: '10px', color: '#A8928C', width: '44px', textAlign: 'center', flexShrink: 0 }}>
                Col {String.fromCharCode(65 + item.col)}
              </span>
              {item.builtin ? (
                <button
                  type="button"
                  onClick={() => setDraft(prev => prev.map(x => x.id === item.id ? { ...x, hidden: !x.hidden } : x))}
                  style={{
                    ...iconBtn,
                    background: item.hidden ? '#F3F4F6' : '#ECFDF5',
                    border: item.hidden ? '1px solid #D1D5DB' : '1px solid #A7F3D0',
                    color: item.hidden ? '#6B7280' : '#065F46'
                  }}
                  title={item.hidden ? 'Show this item again' : 'Hide this item (its column stays in the sheet)'}
                >
                  {item.hidden ? <EyeOff size={14} /> : <Eye size={14} />}
                </button>
              ) : (
                <button
                  type="button"
                  onClick={() => setDraft(prev => prev.filter(x => x.id !== item.id))}
                  style={{ ...iconBtn, background: '#FFF0F0', border: '1px solid #FECACA', color: '#EF4444' }}
                  title="Delete this item"
                >
                  <Trash2 size={14} />
                </button>
              )}
            </div>
          ))}

          {/* Add a new item */}
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '4px' }}>
            <input
              type="text"
              value={newLabel}
              maxLength={80}
              placeholder="New checklist item, e.g. Parent Consent Form"
              onChange={(e) => setNewLabel(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  addItem();
                }
              }}
              style={inputStyle}
            />
            <button
              type="button"
              onClick={addItem}
              style={{
                display: 'inline-flex',
                alignItems: 'center',
                gap: '5px',
                backgroundColor: '#FFE9EF',
                color: '#C44263',
                border: '1px solid #FCD4DE',
                padding: '7px 12px',
                borderRadius: '8px',
                fontSize: '12px',
                fontWeight: 700,
                cursor: 'pointer',
                whiteSpace: 'nowrap'
              }}
            >
              <Plus size={14} />
              Add
            </button>
          </div>

          {error && (
            <div style={{ fontSize: '11px', fontWeight: 600, color: '#B91C1C' }}>{error}</div>
          )}

          {removed.length > 0 && (
            <div style={{
              fontSize: '11px',
              fontWeight: 600,
              color: '#92400E',
              backgroundColor: '#FFFBEB',
              border: '1px solid #FDE68A',
              borderRadius: '8px',
              padding: '8px 10px',
              lineHeight: 1.5
            }}>
              Deleting {removed.map(x => `"${x.label}"`).join(', ')} will remove its column and all its ticks from the spreadsheet when you save.
            </div>
          )}

          <div style={{ fontSize: '11px', color: '#8F7872', lineHeight: 1.5 }}>
            New items get their own checkbox column in the sheet (from column R). The 3 original items (I–K) can be renamed or hidden.
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
            <button
              type="button"
              onClick={() => { setEditing(false); setError(''); }}
              style={{
                backgroundColor: '#FAF4F0',
                border: '1px solid #EBDCD4',
                color: '#6A544F',
                padding: '7px 14px',
                borderRadius: '8px',
                fontSize: '12px',
                fontWeight: 600,
                cursor: 'pointer'
              }}
            >
              Cancel
            </button>
            <button
              type="button"
              onClick={saveEdit}
              style={{
                background: 'linear-gradient(135deg, #E06D85 0%, #E27D60 100%)',
                border: 'none',
                color: '#FFFFFF',
                padding: '7px 16px',
                borderRadius: '8px',
                fontSize: '12px',
                fontWeight: 700,
                cursor: 'pointer'
              }}
            >
              Save & update sheet
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function App({ data, updateItem, deleteItem, insertItem, moveItem, followLink, readOnly = false, onOpenShare = null }) {
  // OPTIMISTIC LOCAL STATE FOR INSTANT 60FPS UI UPDATES (Eliminates artificial delays and input lag)
  const [optimisticData, setOptimisticData] = useState(data);
  const dataRef = useRef(optimisticData);
  dataRef.current = optimisticData;

  // Sync with incoming remote data when prop updates
  useEffect(() => {
    setOptimisticData(data);
  }, [data]);

  const [lastSyncedTime, setLastSyncedTime] = useState(() => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

  const notifySynced = useCallback(() => {
    setLastSyncedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  }, []);

  // Single write path for existing rows: sanitizes (50k-safe), updates UI instantly, syncs to sheet
  const commitRow = useCallback((itemIndex, newRow) => {
    const safeRow = sanitizeRowForSheet(newRow);
    setOptimisticData(prev => (prev || []).map(d => d.index_ === itemIndex ? { ...d, row: safeRow } : d));
    if (updateItem) updateItem(itemIndex, safeRow);
    notifySynced();
  }, [updateItem, notifySynced]);

  // 1. DYNAMIC HEADER & LEGEND DISCOVERY (Computed from active optimistic dataset)
  const effectiveData = optimisticData || data;

  const { headerIndex, legendIndex, privacyNote } = useMemo(() => {
    let hIdx = -1;                        // header row (found below)
    let lIdx = Number.MAX_SAFE_INTEGER;   // no legend rows in the clean CASES tab
    let pNote = '';

    if (Array.isArray(effectiveData)) {
      for (const item of effectiveData) {
        const row = item.row || [];
        if (row[0] === '__TRACKER_CONFIG__' || String(row[0]).trim() === '__TRACKER_CONFIG__') continue;
        // Only scan the text columns (A–P); image chunk columns are skipped for speed
        const textCells = row.slice(0, PHOTO_META_COL + 1);
        // Extract privacy statement if present
        if (row[15] && typeof row[15] === 'string' && row[15].length < 2000 && row[15].includes('Data Privacy Act')) {
          pNote = row[15];
        }
        // Detect table header row
        if (textCells.some(cell => typeof cell === 'string' && cell.toLowerCase().includes('student name'))) {
          hIdx = item.index_;
        }
        // Detect legends start
        if (textCells.some(cell => typeof cell === 'string' && cell.trim() === 'Legends')) {
          lIdx = item.index_;
        }
      }
    }
    return { headerIndex: hIdx, legendIndex: lIdx, privacyNote: pNote };
  }, [effectiveData]);

  // DEFAULT CONFIGURATIONS (with fallback capabilities)

    const fromSheet = extractSheetConfig(data);

    const src = extractSheetConfig(data) || initialSettings || {};
    return normalizeStatuses(src.statusesList, src.kpiConfig);

    const fromSheet = extractSheetConfig(data);
    return { ...DEFAULT_KPI_CONFIG, ...(fromSheet?.kpiConfig || initialSettings?.kpiConfig || {}) };
  });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [settingsTab, setSettingsTab] = useState('headers'); // 'headers' | 'categories' | 'kpis' | 'modalities'
  const [saveToast, setSaveToast] = useState(false);
  const [saveToastMessage, setSaveToastMessage] = useState('');

  const triggerSaveToast = useCallback((msg = 'Settings saved permanently! Will persist across page reloads.') => {
    setSaveToastMessage(msg);
    setSaveToast(true);
    setTimeout(() => {
      setSaveToast(false);
    }, 3800);
  }, []);

  // CHECKLIST STATE (declared before every hook that uses it)
  const [checklistList, setChecklistList] = useState(() =>
    normalizeChecklist(readChecklistFromData(data) || initialSettings?.checklistList)
  );
  const sheetChecklist = useMemo(() => readChecklistFromData(effectiveData), [effectiveData]);

// SHARE PANEL — give people view-only access (editors only)
// ============================================================================
function SharePanel({ access, onClose, onViewersChange }) {
  const [email, setEmail] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState({ text: '', type: '' });
  const [copied, setCopied] = useState(false);
  const linkRef = useRef(null);
  const link = access.webAppUrl || '';

  const copyLink = () => {
    if (!link) return;
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done).catch(() => {
        if (linkRef.current) { linkRef.current.select(); document.execCommand('copy'); done(); }
      });
    } else if (linkRef.current) {
      linkRef.current.select();
      document.execCommand('copy');
      done();
    }
  };

  const add = () => {
    const e = email.trim();
    if (!e) return;
    setBusy(true);
    setMsg({ text: '', type: '' });
    runServer('addViewer', e)
      .then((list) => {
        onViewersChange(list);
        setEmail('');
        setMsg({ text: `${e} can now view the tracker (view only). Send them the link above.`, type: 'ok' });
      })
      .catch((err) => setMsg({ text: err.message || String(err), type: 'err' }))
      .finally(() => setBusy(false));
  };

  const remove = (e) => {
    setBusy(true);
    runServer('removeViewer', e)
      .then((list) => {
        onViewersChange(list);
        setMsg({ text: `${e} no longer has access.`, type: 'ok' });
      })
      .catch((err) => setMsg({ text: err.message || String(err), type: 'err' }))
      .finally(() => setBusy(false));
  };

  const viewers = access.viewers || [];

  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 5500, backgroundColor: 'rgba(56, 42, 38, 0.5)',
      backdropFilter: 'blur(3px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px',
      fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        backgroundColor: '#FFFFFF', borderRadius: '20px', maxWidth: '560px', width: '100%', maxHeight: '90vh',
        overflowY: 'auto', border: '1px solid #F0D9D0', boxShadow: '0 20px 40px rgba(0,0,0,0.18)'
      }}>
        <div style={{
          background: 'linear-gradient(135deg, #EFF6FF 0%, #F5F9FF 100%)', borderBottom: '1px solid #DBEAFE',
          padding: '18px 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between'
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
            <div style={{
              width: '38px', height: '38px', borderRadius: '10px', backgroundColor: '#3B82F6', color: '#FFFFFF',
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}>
              <Share2 size={20} />
            </div>
            <div>
              <h2 style={{ fontSize: '17px', fontWeight: 800, color: '#1E3A8A', margin: 0 }}>Share view-only access</h2>
              <p style={{ fontSize: '12px', color: '#64748B', margin: '2px 0 0 0' }}>
                People you add can see the tracker and photos, but cannot add, edit or delete anything.
              </p>
            </div>
          </div>
          <button type="button" onClick={onClose} style={{ background: 'none', border: 'none', color: '#64748B', cursor: 'pointer', padding: '4px' }}>
            <X size={20} />
          </button>
        </div>

        <div style={{ padding: '20px 22px' }}>
          {/* Step 1: add people */}
          <div style={{ fontSize: '12px', fontWeight: 700, color: '#523B36', marginBottom: '6px' }}>
            1. Add the person's Google email
          </div>
          <div style={{ display: 'flex', gap: '8px', marginBottom: '8px' }}>
            <input
              type="email"
              value={email}
              placeholder="name@gmail.com"
              onChange={(e) => setEmail(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
              style={{
                flex: 1, padding: '9px 12px', borderRadius: '8px', border: '1.5px solid #E8D5CC',
                backgroundColor: '#FAF5F1', fontSize: '13px', outline: 'none'
              }}
            />
            <button type="button" onClick={add} disabled={busy || !email.trim()} style={{
              display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '9px 14px', borderRadius: '8px',
              border: 'none', background: 'linear-gradient(135deg, #3B82F6 0%, #2563EB 100%)', color: '#FFFFFF',
              fontSize: '12px', fontWeight: 700, cursor: busy ? 'wait' : 'pointer', opacity: (busy || !email.trim()) ? 0.6 : 1
            }}>
              {busy ? <Loader2 size={14} style={{ animation: 'spin 1s linear infinite' }} /> : <UserPlus size={14} />}
              Give view access
            </button>
          </div>

          {msg.text && (
            <div style={{
              fontSize: '12px', fontWeight: 600, padding: '8px 12px', borderRadius: '8px', marginBottom: '12px',
              backgroundColor: msg.type === 'err' ? '#FEF2F2' : '#ECFDF5',
              color: msg.type === 'err' ? '#991B1B' : '#065F46',
              border: `1px solid ${msg.type === 'err' ? '#FECACA' : '#A7F3D0'}`
            }}>
              {msg.text}
            </div>
          )}

          {/* Step 2: send the link */}
          <div style={{ fontSize: '12px', fontWeight: 700, color: '#523B36', margin: '14px 0 6px' }}>
            2. Send them this link
          </div>
          {link ? (
            <div style={{ display: 'flex', gap: '8px' }}>
              <input
                ref={linkRef}
                readOnly
                value={link}
                onFocus={(e) => e.target.select()}
                style={{
                  flex: 1, padding: '9px 12px', borderRadius: '8px', border: '1px solid #DBEAFE',
                  backgroundColor: '#F8FAFF', fontSize: '12px', color: '#1E3A8A'

              />
              <button type="button" onClick={copyLink} style={{
                display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '9px 14px', borderRadius: '8px',
                border: '1px solid #BFDBFE', backgroundColor: copied ? '#ECFDF5' : '#EFF6FF',
                color: copied ? '#065F46' : '#1D4ED8', fontSize: '12px', fontWeight: 700, cursor: 'pointer'
              }}>
                {copied ? <CheckCircle2 size={14} /> : <Copy size={14} />}
                {copied ? 'Copied' : 'Copy'}
              </button>
            </div>
          ) : (
            <div style={{
              fontSize: '12px', padding: '10px 12px', borderRadius: '8px', backgroundColor: '#FFFBEB',
              color: '#92400E', border: '1px solid #FDE68A', lineHeight: 1.5
            }}>
              No link yet. In Apps Script, click <b>Deploy → New deployment → Web app</b>
              (Execute as: <b>User accessing the web app</b>, Who has access: <b>Anyone with Google account</b>),
              then reopen this window.
            </div>
          )}
          <div style={{ fontSize: '11px', color: '#8F7872', marginTop: '6px', lineHeight: 1.5 }}>
            Only people on the list below (and editors) can open it — anyone else sees an access error.
            The first time they open it, Google asks them to allow access once.
          </div>

          {/* Current viewers */}
          <div style={{ fontSize: '12px', fontWeight: 700, color: '#523B36', margin: '18px 0 8px' }}>
            People with view-only access ({viewers.length})
          </div>
          {viewers.length === 0 ? (
            <div style={{ fontSize: '12px', color: '#8F7872', padding: '10px 12px', backgroundColor: '#FAF5F1', borderRadius: '8px' }}>
              No one yet.

          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {viewers.map(v => (
                <div key={v.email} style={{

// ============================================================================
// ROOT — connects the App to the spreadsheet through Code.gs
// Provides the same props the canvas used: data, updateItem, insertItem, deleteItem
// ============================================================================
function Root() {
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const [access, setAccess] = useState(null);
  const [shareOpen, setShareOpen] = useState(false);
  const seqRef = useRef(0);        // newest request wins (prevents old responses overwriting newer edits)
  const pendingRef = useRef(0);    // number of saves in flight

  const load = useCallback(() => {
    const mySeq = ++seqRef.current;
    return runServer('getData')
      .then((fresh) => {
        if (mySeq === seqRef.current) setData(fresh);
      })
      .catch((err) => setError(err.message || String(err)));
  }, []);

  useEffect(() => {
    runServer('getAccessInfo')
      .then(setAccess)
      .catch(() => setAccess({ role: 'viewer', email: '', webAppUrl: '', viewers: [] }));
    load();
    // Pick up edits made by other staff every 60 seconds (skipped while a save is in progress)
    const timer = setInterval(() => {
      if (pendingRef.current === 0 && document.visibilityState === 'visible') load();
    }, 60000);
    return () => clearInterval(timer);
  }, [load]);

  const mutate = useCallback((fnName, ...args) => {
    const mySeq = ++seqRef.current;
    pendingRef.current++;
    return runServer(fnName, ...args)
      .then((fresh) => {
        if (mySeq === seqRef.current) setData(fresh);
      })
      .catch((err) => {
        setError(`Save failed: ${err.message || err}. Reloading latest data from the sheet.`);
        load();
      })
      .finally(() => {
        pendingRef.current--;
      });
  }, [load]);

  const updateItem = useCallback((index, row) => mutate('updateRow', index, row), [mutate]);
  const insertItem = useCallback((index, row) => mutate('insertRow', index === undefined ? null : index, row), [mutate]);
  const deleteItem = useCallback((index) => {
    // Demo visitors: deleting is locked on the server, so explain instead of trying.
    if (access && access.demo) {
      setError('Deleting cases is turned off in the demo. You can still add and edit cases — everything resets every night.');
      return load();
    }
    return mutate('deleteCase', index);
  }, [mutate, access, load]);

  if (!data || !access) {
    return (
      <div style={{ fontFamily: 'system-ui, sans-serif', padding: '48px', textAlign: 'center', color: error ? '#991B1B' : '#8F7872' }}>
        {error ? `Could not load the tracker: ${error}` : 'Loading Master Tracker…'}
      </div>
    );
  }

  return (
    <>
      {error && (
        <div style={{
          position: 'fixed', top: '12px', left: '50%', transform: 'translateX(-50%)', zIndex: 6000,
          backgroundColor: '#FEF2F2', color: '#991B1B', border: '1px solid #FECACA', borderRadius: '10px',
          padding: '10px 16px', fontSize: '13px', fontWeight: 600, fontFamily: 'system-ui, sans-serif',
          display: 'flex', gap: '12px', alignItems: 'center', boxShadow: '0 6px 18px rgba(0,0,0,0.12)', maxWidth: '90vw'
        }}>
          <span>{error}</span>
          <button onClick={() => setError('')} style={{ border: 'none', background: 'transparent', color: '#991B1B', cursor: 'pointer', fontWeight: 800 }}>✕</button>
        </div>
      )}
      <App
        data={data}
        updateItem={updateItem}
        insertItem={insertItem}
        deleteItem={deleteItem}
        readOnly={access.role !== 'editor'}
        onOpenShare={access.role === 'editor' && !access.demo ? () => setShareOpen(true) : null}
      />
      {access.demo && (
        <div style={{
          position: 'fixed', left: '16px', bottom: '16px', zIndex: 5000, maxWidth: 'calc(100vw - 32px)',
          display: 'flex', alignItems: 'center', gap: '10px', padding: '9px 14px', borderRadius: '999px',
          backgroundColor: '#FDE68A', color: '#382A26', fontFamily: 'system-ui, sans-serif', fontSize: '12px',
          fontWeight: 700, boxShadow: '0 6px 18px rgba(0,0,0,0.12)'
        }}>
          <span>Demo · every student here is fictional · try adding or editing a case · resets nightly</span>
        </div>
      )}
      {shareOpen && (
        <SharePanel
          access={access}
          onClose={() => setShareOpen(false)}
          onViewersChange={(viewers) => setAccess(prev => ({ ...prev, viewers }))}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
